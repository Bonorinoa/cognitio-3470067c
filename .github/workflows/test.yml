name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The project .env is git-ignored, but Vite reads VITE_SUPABASE_* at
      # build/test time and src/integrations/supabase/client.ts throws at
      # import if they're missing. These are PUBLIC keys (publishable anon
      # key + project URL) already shipped to every browser visitor, so
      # writing them inline here is safe and unblocks CI.
      - name: Write .env for Vite (public keys only)
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_PROJECT_ID="hlnvfkturjctxbiikfoe"
          VITE_SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsbnZma3R1cmpjdHhiaWlrZm9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzMzc3MjIsImV4cCI6MjA4MTkxMzcyMn0.G5vlQIGb2FrLkIcJwTnvycUIyOqgcb9M9fK5KFXCwZo"
          VITE_SUPABASE_URL="https://hlnvfkturjctxbiikfoe.supabase.co"
          EOF

      - name: Run tests
        run: npx vitest run --coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
